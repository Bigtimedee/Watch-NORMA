# Apply ONE pending, additive Supabase migration to production through the
# Management API, with a read-only check first. Dispatch-only.
#
# Actions → "Apply migration" → Run workflow.
#   mode=check (default): read-only. Lists repo migration files NOT recorded in
#     supabase_migrations.schema_migrations and whether their objects exist.
#   mode=apply: refuses unless the target is the only unapplied file, or every
#     other unapplied file's objects are confirmed present. Runs the file and the
#     schema_migrations insert in one transaction, then verifies.
#     allow_unverified_others=true (opt-in) turns that refusal into a warning
#     for the named migration only; other files are listed and not applied.
#   mode=live-moments-dry-run: calls cmo-live-moments with dry_run=true
#     (todays_games and live) via pg_net + vault, like pg_cron. No writes, no posts.
# Uses repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
# Script: scripts/apply-migration.mjs

name: Apply migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration filename under supabase/migrations/ (e.g. 20261107180000_social_live_moments.sql)"
        required: false
        default: ""
      mode:
        description: "check | apply | live-moments-dry-run"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
          - live-moments-dry-run
      allow_unverified_others:
        description: "apply only: proceed for the named migration even if OTHER unapplied files are not confirmed present (they are listed as a warning and not applied)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apply-migration
  cancel-in-progress: false

jobs:
  apply-migration:
    name: Migration ${{ inputs.mode }} ${{ inputs.migration }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIGRATION: ${{ inputs.migration }}
      MODE: ${{ inputs.mode }}
      ALLOW_UNVERIFIED_OTHERS: ${{ inputs.allow_unverified_others && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require GitHub repo secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set on this repository."
            exit 1
          fi
      - name: Validate input
        run: |
          if [ "$MODE" = "apply" ] && [ -z "$MIGRATION" ]; then
            echo "::error::mode=apply needs a migration filename."; exit 1
          fi
          if [ -n "$MIGRATION" ] && ! printf '%s' "$MIGRATION" | grep -Eq '^[0-9]+_[A-Za-z0-9_]+\.sql$'; then
            echo "::error::migration must be a bare filename like 20261107180000_name.sql"; exit 1
          fi
          if [ -n "$MIGRATION" ] && [ ! -f "supabase/migrations/$MIGRATION" ]; then
            echo "::error::supabase/migrations/$MIGRATION not found"; exit 1
          fi
      - name: Run
        run: node scripts/apply-migration.mjs "$MODE" "$MIGRATION"
