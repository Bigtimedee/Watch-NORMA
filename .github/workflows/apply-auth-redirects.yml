# Re-apply supabase/auth-redirects.json to hosted Auth URL config without a code change.
# Dispatch-only. Merge-to-main also applies via the CI job in ci.yml.
#
# Actions → "Apply Auth redirects" → Run workflow.
# Uses repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF
# (same pair as Edge Function deploy). Default project is shijrazlzawjpobrpmnt.

name: Apply Auth redirects

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-auth-redirects:
    name: PATCH hosted Auth site_url + allowlist
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require GitHub repo secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set on this repository."
            echo "Dashboard fallback: set Site URL to https://getnorma.app/auth/reset-password"
            echo "See docs/operations/auth-redirects.md."
            exit 1
          fi
          echo "Using project-ref (length ${#SUPABASE_PROJECT_REF})."
      - name: PATCH hosted Auth redirects
        run: node scripts/apply-auth-redirects.mjs
