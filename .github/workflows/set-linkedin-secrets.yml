# One-off: set LinkedIn Edge Function secrets on the production Supabase project.
# Dispatch-only — does not run on push or pull_request. CI is not required.
#
# After merge to main: Actions → "Set LinkedIn Supabase secrets" → Run workflow.
# Uses existing repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
#
# Company page: https://www.linkedin.com/company/watch-norma/
# Organization id: 146336141  (urn:li:organization:146336141)
#
# Do not put LINKEDIN_ACCESS_TOKEN (or any other LinkedIn token) in this file.
# Optionally paste it as the workflow_dispatch input linkedin_access_token.
# This workflow can be deleted after a successful run.

name: Set LinkedIn Supabase secrets

on:
  workflow_dispatch:
    inputs:
      linkedin_access_token:
        description: >
          Optional LINKEDIN_ACCESS_TOKEN for cmo-publish-linkedin (leave empty
          to set only LINKEDIN_ORGANIZATION_ID). Never commit this value.
        required: false
        type: string

permissions:
  contents: read

jobs:
  set-linkedin-secrets:
    name: Set LinkedIn Edge Function secrets
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require GitHub repo secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set on this repository."
            exit 1
          fi
          echo "Using project-ref (length ${#SUPABASE_PROJECT_REF})."

      - name: Set LINKEDIN_ORGANIZATION_ID
        run: npx --yes supabase secrets set LINKEDIN_ORGANIZATION_ID=146336141 --project-ref "$SUPABASE_PROJECT_REF"

      - name: Optionally set LINKEDIN_ACCESS_TOKEN
        run: |
          set -euo pipefail
          TOKEN=$(jq -r '.inputs.linkedin_access_token // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "No linkedin_access_token input; skipping LINKEDIN_ACCESS_TOKEN."
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          ENV_FILE="$(mktemp)"
          umask 077
          printf 'LINKEDIN_ACCESS_TOKEN=%s\n' "$TOKEN" > "$ENV_FILE"
          npx --yes supabase secrets set --env-file "$ENV_FILE" --project-ref "$SUPABASE_PROJECT_REF"
          rm -f "$ENV_FILE"
          echo "LINKEDIN_ACCESS_TOKEN was set."
