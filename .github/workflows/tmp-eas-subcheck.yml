name: TMP EAS Sub Check
on:
  push:
    branches: [chore/tmp-eas-status-2c473912]
    paths:
      - 'scripts/trigger-subcheck.txt'
jobs:
  sub:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Submission list
        run: |
          eas submit:list --platform ios --limit 3 --non-interactive
          echo '====GQL===='
          curl -sS -X POST https://api.expo.dev/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${EXPO_TOKEN}" \
            -d '{"query":"query { submissions(limit:3, offset:0, filter:{ platform: IOS }) { id status platform createdAt updatedAt completedAt } }"}'
          echo
