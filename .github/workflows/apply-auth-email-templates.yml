# Re-apply supabase/templates/*.html to the hosted Auth mailer without a code change.
# Dispatch-only. Merge-to-main also applies via the CI job in ci.yml.
#
# Actions → "Apply Auth email templates" → Run workflow.
# Uses repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF
# (same pair as Edge Function deploy). Default project is shijrazlzawjpobrpmnt.

name: Apply Auth email templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-auth-email-templates:
    name: PATCH hosted Auth mailer templates
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require GitHub repo secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF is not set on this repository."
            echo "Dashboard fallback: paste supabase/templates/*.html into Authentication → Email Templates."
            echo "See docs/operations/auth-email-templates.md."
            exit 1
          fi
          echo "Using project-ref (length ${#SUPABASE_PROJECT_REF})."
      - name: PATCH hosted Auth mailer templates
        run: node scripts/apply-auth-email-templates.mjs
      - name: Dashboard fallback if Management API rejected the token
        if: failure()
        run: |
          echo "::error::Hosted Auth templates were NOT applied. 401 = rotate SUPABASE_ACCESS_TOKEN, then re-run this workflow."
          echo "::error::Immediate unblock: paste supabase/templates/*.html into https://supabase.com/dashboard/project/shijrazlzawjpobrpmnt/auth/templates"
