name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (TypeCheck + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test -- --ci --coverage

  deno:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check logic files
        run: |
          deno check supabase/functions/evaluate-alerts/logic.ts
          deno check supabase/functions/resolve-wagers/logic.ts
          deno check supabase/functions/_shared/utils.ts
          deno check supabase/functions/_shared/kalshi-crypto.ts
          deno check supabase/functions/_shared/polling-state.ts
          deno check supabase/functions/_shared/team-matching.ts
          deno check supabase/functions/_shared/social-publishers.ts
          deno check supabase/functions/_shared/social-content-engine.ts
          deno check supabase/functions/_shared/x-oauth.ts
          deno check supabase/functions/_shared/template-vars.ts
          deno check supabase/functions/cmo-generate/index.ts
          deno check supabase/functions/cmo-publish/index.ts
          deno check supabase/functions/publish-social-posts/index.ts
          deno check supabase/functions/generate-social-content/index.ts
          deno check supabase/functions/generate-recap-content/index.ts
          deno check supabase/functions/fetch-social-metrics/index.ts
          deno check supabase/functions/resolve-predictions/index.ts
      - name: Run tests
        run: deno test --allow-env --allow-net=none supabase/functions/

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase stop

  ota-update:
    name: OTA Update (EAS)
    runs-on: ubuntu-latest
    needs: [client, deno, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --auto --channel production --non-interactive
        if: env.EXPO_TOKEN != ''
