name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client (TypeCheck + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test -- --ci --coverage

  deno:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check logic files
        run: |
          deno check supabase/functions/evaluate-alerts/logic.ts
          deno check supabase/functions/resolve-wagers/logic.ts
          deno check supabase/functions/_shared/utils.ts
          deno check supabase/functions/_shared/kalshi-crypto.ts
          deno check supabase/functions/_shared/polling-state.ts
          deno check supabase/functions/_shared/team-matching.ts
          deno check supabase/functions/_shared/template-vars.ts
          deno check supabase/functions/resolve-predictions/index.ts
          # The poll-* functions deploy straight to production on every push to
          # main but were never type-checked here. A SportsDataIO removal on
          # 2026-08-20 surfaced the gap: a type error in these files would have
          # shipped unverified.
          deno check supabase/functions/poll-schedule/index.ts
          deno check supabase/functions/poll-boxscore/index.ts
          deno check supabase/functions/poll-summary/index.ts
          deno check supabase/functions/poll-pbp/index.ts
          # evaluate-alerts and intent-api entry points were both failing deno
          # check on 2026-08-20 (audit item I / 2026-08-23 audit H-10). Fixed
          # in Phase 2 FX7; adding them here so a regression can't reland.
          deno check supabase/functions/evaluate-alerts/index.ts
          deno check supabase/functions/intent-api/index.ts
          deno check supabase/functions/_shared/quiet-hours.ts
      - name: Run tests
        # --allow-read: parse-bet-slip_test.ts and geo/migration source tests
        # read live files. No network; --allow-net=none stays.
        run: deno test --allow-env --allow-read --allow-net=none supabase/functions/

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase stop

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [client, deno, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Warn if secrets are missing
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: |
          echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not set."
          echo "::warning::Edge Functions were NOT deployed. Repo and production will drift."
      - name: Deploy all Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: List deployed functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

  ota-update:
    name: OTA Update (EAS)
    runs-on: ubuntu-latest
    needs: [client, deno, migrations, deploy-functions]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --auto --channel production --non-interactive
        if: env.EXPO_TOKEN != ''
        env:
          # Inlined into the OTA JS bundle at publish time. Without these, an
          # update published from CI ships process.env.EXPO_PUBLIC_* as
          # undefined and lib/supabase.ts throws at cold launch (the build
          # 1.4.0(23) crash). Public client config by design: anon key only,
          # verified role=anon; never put a service_role key here.
          EXPO_PUBLIC_SUPABASE_URL: https://shijrazlzawjpobrpmnt.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoaWpyYXpsemF3anBvYnJwbW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNDI2NjMsImV4cCI6MjA4NjkxODY2M30.3nqRpyNWdILhy0f8NexYgiZjFxXM8jm6r2DHYtFxJ0Y

  eas-build:
    name: EAS Build (iOS, tag-gated)
    runs-on: ubuntu-latest
    needs: [client, deno, migrations]
    # Fires only when a main-branch push's commit message contains [eas-build],
    # so ordinary pushes never consume EAS build credits. Build-time env comes
    # from eas.json (build.production.env), not from this job.
    if: >
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[eas-build]')
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue iOS production build (auto-submit)
        if: env.EXPO_TOKEN != ''
        # --no-wait: EAS builds and submits server-side; CI does not block.
        run: eas build --platform ios --profile production --non-interactive --no-wait --auto-submit
      - name: Warn if EXPO_TOKEN missing
        if: env.EXPO_TOKEN == ''
        run: echo "::warning::EXPO_TOKEN not set - build was NOT queued."
