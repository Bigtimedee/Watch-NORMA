# Daily usage scorecard: read-only aggregate queries against production
# Supabase (shijrazlzawjpobrpmnt), committed as JSON to the orphan `metrics`
# branch (never main), so the scorecard can read it without a Supabase key.
#
# Writes metrics/daily/<report_date>.json and metrics/latest.json on `metrics`.
# report_date = yesterday on the America/Chicago calendar.
# Uses repo secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF
# (same pair as Edge Function deploy). Docs: docs/operations/daily-metrics.md

name: Daily metrics

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC = 06:00 CST / 07:00 CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-metrics
  cancel-in-progress: false

jobs:
  daily-metrics:
    name: Collect daily metrics
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require GitHub repo secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on this repository."
            exit 1
          fi
      - name: Run read-only metric queries
        run: node scripts/daily-metrics.mjs "$RUNNER_TEMP/metrics-out"
      - name: Commit to orphan metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/metrics-out"
          WT="$RUNNER_TEMP/metrics-branch"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin metrics >/dev/null 2>&1; then
            git fetch --depth=1 origin metrics:refs/remotes/origin/metrics
            git worktree add "$WT" -B metrics origin/metrics
          else
            git worktree add --detach "$WT"
            git -C "$WT" checkout --orphan metrics
            git -C "$WT" rm -rf --quiet . || true
            git -C "$WT" clean -fdx
            printf '# metrics\n\nGenerated by .github/workflows/daily-metrics.yml on main. Aggregates only. Do not merge into main.\n' > "$WT/README.md"
          fi
          # Vercel (watch-norma, Root Directory "web") reads web/vercel.json from
          # this branch; without it every metrics push fails ROOTDIR_NOT_EXIST.
          # Keep it present so Vercel never builds this data-only branch.
          mkdir -p "$WT/web"
          printf '{\n  "git": {\n    "deploymentEnabled": {\n      "metrics": false\n    }\n  }\n}\n' > "$WT/web/vercel.json"
          mkdir -p "$WT/metrics/daily"
          cp "$OUT"/daily/*.json "$WT/metrics/daily/"
          cp "$OUT/latest.json" "$WT/metrics/latest.json"
          git -C "$WT" add -A
          if git -C "$WT" diff --cached --quiet; then
            echo "No changes."; exit 0
          fi
          DATE=$(jq -r .report_date "$OUT/latest.json")
          git -C "$WT" commit -m "metrics: $DATE"
          git -C "$WT" push origin HEAD:refs/heads/metrics
